<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 224" width="260" height="224" role="img" aria-label="Trenchy bot">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffe98a"/>
      <stop offset=".42"  stop-color="#ffc61e"/>
      <stop offset="1"    stop-color="#e08600"/>
    </linearGradient>
    <linearGradient id="gk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd24a"/><stop offset="1" stop-color="#b96b00"/>
    </linearGradient>
    <linearGradient id="gf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffb400" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- side ear knobs -->
  <g stroke="#12100c" stroke-width="5" stroke-linejoin="round">
    <rect x="30"  y="76" width="24" height="46" rx="9" fill="url(#gk)"/>
    <rect x="206" y="76" width="24" height="46" rx="9" fill="url(#gk)"/>
  </g>
  <g stroke="#12100c" stroke-width="2.5" opacity=".55">
    <line x1="42" y1="80" x2="42" y2="118"/>
    <line x1="218" y1="80" x2="218" y2="118"/>
  </g>

  <!-- claw hands -->
  <g fill="#14110c" stroke="#0a0906" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M44 150 q-22 4 -24 26 q-1 20 16 24 q14 3 20 -10 l6 -16 z"/>
    <path d="M216 150 q22 4 24 26 q1 20 -16 24 q-14 3 -20 -10 l-6 -16 z"/>
  </g>
  <g stroke="#2a251c" stroke-width="3" stroke-linecap="round">
    <line x1="30" y1="166" x2="48" y2="170"/>
    <line x1="29" y1="180" x2="48" y2="183"/>
    <line x1="230" y1="166" x2="212" y2="170"/>
    <line x1="231" y1="180" x2="212" y2="183"/>
  </g>

  <!-- head -->
  <g filter="url(#glow)">
    <rect x="48" y="34" width="164" height="126" rx="28" fill="url(#gb)" stroke="#12100c" stroke-width="6"/>
  </g>
  <rect x="48" y="34" width="164" height="126" rx="28" fill="url(#gf)"/>
  <rect x="62" y="48" width="136" height="98" rx="20" fill="none" stroke="#12100c" stroke-width="2.5" opacity=".28"/>
  <!-- corner screws -->
  <g fill="#12100c" opacity=".55">
    <circle cx="66" cy="52" r="3"/><circle cx="194" cy="52" r="3"/>
    <circle cx="66" cy="142" r="3"/><circle cx="194" cy="142" r="3"/>
  </g>

  <!-- eyes -->
  <g>
    <ellipse cx="110" cy="100" rx="29" ry="33" fill="#fff" stroke="#12100c" stroke-width="6"/>
    <ellipse cx="150" cy="100" rx="29" ry="33" fill="#fff" stroke="#12100c" stroke-width="6"/>
  </g>
  <g>
    <circle cx="117" cy="107" r="12.5" fill="#12100c"/>
    <circle cx="143" cy="107" r="12.5" fill="#12100c"/>
    <circle cx="112" cy="101" r="4.4" fill="#fff"/>
    <circle cx="138" cy="101" r="4.4" fill="#fff"/>
  </g>
  <!-- eyelids for blink -->
  <g fill="#ffc61e">
    <rect class="lid" x="82"  y="67" width="58" height="66" rx="6"/>
    <rect class="lid" x="122" y="67" width="58" height="66" rx="6"/>
  </g>

  <!-- little tag -->
  <g transform="translate(88,158)">
    <rect x="0" y="0" width="84" height="26" rx="7" fill="#14110c" stroke="#0a0906" stroke-width="3"/>
    <text x="42" y="18" text-anchor="middle" font-family="'Share Tech Mono',ui-monospace,monospace"
          font-size="14" fill="#ffd167" letter-spacing="1">trench</text>
  </g>
</svg>
